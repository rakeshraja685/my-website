<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
    <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#b2ebf2;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#006064;stop-opacity:1" />
        </linearGradient>
        <style>
            @keyframes float {
                0%, 100% { transform: translateY(0px); }
                50% { transform: translateY(-20px); }
            }
            @keyframes glow {
                0%, 100% { opacity: 0.5; }
                50% { opacity: 1; }
            }
            .layer { animation: float 4s ease-in-out infinite; transform-origin: center; }
            .layer1 { animation-delay: 0s; }
            .layer2 { animation-delay: 0.2s; }
            .layer3 { animation-delay: 0.4s; }
            .accent { animation: glow 2s infinite; }
        </style>
    </defs>
    <!-- Background -->
    <rect width="800" height="600" fill="#f4faff" />
    
    <!-- Grid Base -->
    <path d="M400,500 L200,400 L400,300 L600,400 Z" fill="none" stroke="#e0f7fa" stroke-width="2" />
    <path d="M400,480 L220,390 L400,300 L580,390 Z" fill="none" stroke="#e0f7fa" stroke-width="1" />
    
    <g transform="translate(400, 350)">
        <!-- Layer 1 -->
        <g class="layer layer1">
            <path d="M0,0 L-100,-50 L0,-100 L100,-50 Z" fill="url(#grad1)" opacity="0.9"/>
            <path d="M-100,-50 L0,0 L0,20 L-100,-30 Z" fill="#00464a" />
            <path d="M0,0 L100,-50 L100,-30 L0,20 Z" fill="#006064" />
        </g>
        <!-- Layer 2 -->
        <g class="layer layer2" transform="translate(0, -60)">
            <path d="M0,0 L-100,-50 L0,-100 L100,-50 Z" fill="url(#grad1)" opacity="0.8"/>
            <path d="M-100,-50 L0,0 L0,20 L-100,-30 Z" fill="#00464a" />
            <path d="M0,0 L100,-50 L100,-30 L0,20 Z" fill="#006064" />
        </g>
        <!-- Layer 3 -->
        <g class="layer layer3" transform="translate(0, -120)">
            <path d="M0,0 L-100,-50 L0,-100 L100,-50 Z" fill="url(#grad1)" opacity="0.9"/>
            <path d="M-100,-50 L0,0 L0,20 L-100,-30 Z" fill="#00464a" />
            <path d="M0,0 L100,-50 L100,-30 L0,20 Z" fill="#006064" />
        </g>
        
        <!-- Animated glowing nodes -->
        <circle cx="0" cy="-200" r="15" fill="#b2ebf2" class="accent" />
        <circle cx="-120" cy="-100" r="10" fill="#b2ebf2" class="accent" style="animation-delay: 0.5s;" />
        <circle cx="120" cy="-100" r="10" fill="#b2ebf2" class="accent" style="animation-delay: 1s;" />
    </g>
</svg>

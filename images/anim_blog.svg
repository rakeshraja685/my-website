<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
    <defs>
        <style>
            @keyframes type {
                0% { transform: scaleX(0); }
                100% { transform: scaleX(1); }
            }
            @keyframes floatup {
                0%, 100% { transform: translateY(0) scale(1); opacity: 0.8; }
                50% { transform: translateY(-15px) scale(1.05); opacity: 1; }
            }
            .line { transform-origin: left; animation: type 2s ease-out infinite alternate; }
            .bubble { animation: floatup 3s ease-in-out infinite; }
        </style>
    </defs>
    <rect width="800" height="600" fill="#f4faff" />
    
    <!-- Base -->
    <path d="M400,480 L200,380 L400,280 L600,380 Z" fill="#e3f0f8" stroke="#b2ebf2" stroke-width="2" />
    
    <!-- Blog Post -->
    <g transform="translate(400, 380)">
        <path d="M-100,-80 L0,-30 L100,-80 L0,-130 Z" fill="#ffffff" stroke="#006064" stroke-width="3" />
        <g class="line" style="animation-delay: 0s;">
            <path d="M-50,-100 L0,-75" stroke="#00464a" stroke-width="4" fill="none" />
        </g>
        <g class="line" style="animation-delay: 0.2s;">
            <path d="M-30,-110 L20,-85" stroke="#00464a" stroke-width="4" fill="none" />
        </g>
        <g class="line" style="animation-delay: 0.4s;">
            <path d="M-10,-120 L40,-95" stroke="#b2ebf2" stroke-width="4" fill="none" />
        </g>
    </g>

    <!-- Floating Bubbles -->
    <g class="bubble" style="animation-delay: 0s;" transform="translate(300, 200)">
        <circle cx="0" cy="0" r="30" fill="#006064" />
        <path d="M-15,0 L15,0 M0,-15 L0,15" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    </g>
    <g class="bubble" style="animation-delay: 1s;" transform="translate(500, 150)">
        <circle cx="0" cy="0" r="40" fill="#b2ebf2" />
        <circle cx="0" cy="0" r="10" fill="#00464a" />
    </g>
</svg>

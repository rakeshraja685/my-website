<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
    <defs>
        <style>
            @keyframes grow1 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-40px); } }
            @keyframes grow2 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-70px); } }
            @keyframes grow3 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-100px); } }
            .bar { transform-origin: bottom; }
            .b1 { animation: grow1 3s ease-in-out infinite; }
            .b2 { animation: grow2 3s ease-in-out infinite; animation-delay: 0.5s; }
            .b3 { animation: grow3 3s ease-in-out infinite; animation-delay: 1s; }
        </style>
    </defs>
    <rect width="800" height="600" fill="#f4faff" />
    
    <path d="M400,450 L150,325 L400,200 L650,325 Z" fill="#e0f7fa" opacity="0.8" />
    
    <g transform="translate(400, 350)">
        <!-- Bar 1 -->
        <g class="b1" transform="translate(-80, -20)">
            <path d="M0,0 L30,15 L30,-50 L0,-65 Z" fill="#b2ebf2" />
            <path d="M30,15 L60,0 L60,-65 L30,-50 Z" fill="#006064" />
            <path d="M0,-65 L30,-50 L60,-65 L30,-80 Z" fill="#ffffff" />
        </g>
        <!-- Bar 2 -->
        <g class="b2" transform="translate(0, -60)">
            <path d="M0,0 L30,15 L30,-80 L0,-95 Z" fill="#b2ebf2" />
            <path d="M30,15 L60,0 L60,-95 L30,-80 Z" fill="#006064" />
            <path d="M0,-95 L30,-80 L60,-95 L30,-110 Z" fill="#ffffff" />
        </g>
        <!-- Bar 3 -->
        <g class="b3" transform="translate(80, -100)">
            <path d="M0,0 L30,15 L30,-120 L0,-135 Z" fill="#b2ebf2" />
            <path d="M30,15 L60,0 L60,-135 L30,-120 Z" fill="#006064" />
            <path d="M0,-135 L30,-120 L60,-135 L30,-150 Z" fill="#ffffff" />
        </g>
    </g>
</svg>

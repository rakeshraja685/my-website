<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
    <defs>
        <style>
            @keyframes checkAnim {
                0% { stroke-dasharray: 0, 100; opacity: 0; }
                50% { stroke-dasharray: 100, 0; opacity: 1; }
                100% { stroke-dasharray: 100, 0; opacity: 0; }
            }
            .check { stroke-dasharray: 100, 0; animation: checkAnim 3s infinite; }
            .c1 { animation-delay: 0s; }
            .c2 { animation-delay: 1s; }
            .c3 { animation-delay: 2s; }
        </style>
    </defs>
    <rect width="800" height="600" fill="#f4faff" />
    
    <path d="M400,500 L250,425 L400,350 L550,425 Z" fill="#e3f0f8" />
    <path d="M400,480 L250,405 L400,330 L550,405 Z" fill="#ffffff" stroke="#b2ebf2" stroke-width="4" />
    
    <!-- List Items -->
    <g transform="translate(400, 420)">
        <path d="M-80,-20 L-20,10" stroke="#00464a" stroke-width="8" stroke-linecap="round" />
        <circle cx="-100" cy="-30" r="15" fill="#e0f7fa" stroke="#006064" stroke-width="3" />
        <path d="M-108,-30 L-102,-24 L-90,-38" fill="none" stroke="#006064" stroke-width="4" class="check c1" />
        
        <path d="M-40,-40 L20,-10" stroke="#00464a" stroke-width="8" stroke-linecap="round" />
        <circle cx="-60" cy="-50" r="15" fill="#e0f7fa" stroke="#006064" stroke-width="3" />
        <path d="M-68,-50 L-62,-44 L-50,-58" fill="none" stroke="#006064" stroke-width="4" class="check c2" />
        
        <path d="M0,-60 L60,-30" stroke="#00464a" stroke-width="8" stroke-linecap="round" />
        <circle cx="-20" cy="-70" r="15" fill="#e0f7fa" stroke="#006064" stroke-width="3" />
        <path d="M-28,-70 L-22,-64 L-10,-78" fill="none" stroke="#006064" stroke-width="4" class="check c3" />
    </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
    <defs>
        <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#b2ebf2;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#00464a;stop-opacity:1" />
        </linearGradient>
        <style>
            @keyframes bounce {
                0%, 100% { transform: translateY(0) scale(1); }
                50% { transform: translateY(-30px) scale(1.05); }
            }
            @keyframes pulse {
                0%, 100% { r: 5; opacity: 0.5; }
                50% { r: 15; opacity: 1; }
            }
            .heart { animation: bounce 2.5s ease-in-out infinite; transform-origin: center; }
            .node { animation: pulse 2s infinite; }
        </style>
    </defs>
    <!-- Background -->
    <rect width="800" height="600" fill="#f4faff" />
    
    <!-- Base Platform -->
    <path d="M400,450 L250,375 L400,300 L550,375 Z" fill="#e3f0f8" stroke="#b2ebf2" stroke-width="2" />
    
    <g transform="translate(400, 300)">
        <!-- Isometric Heart / App Icon -->
        <g class="heart">
            <path d="M-30,-30 L0,0 L30,-30 C45,-45 70,-20 50,0 L0,50 L-50,0 C-70,-20 -45,-45 -30,-30 Z" fill="url(#grad2)" />
            <path d="M-30,-30 L0,0 L30,-30 C45,-45 70,-20 50,0 L0,50 L-50,0 C-70,-20 -45,-45 -30,-30 Z" fill="none" stroke="#ffffff" stroke-width="4" transform="translate(0, 10)" opacity="0.3" />
            
            <circle cx="-60" cy="-40" r="10" fill="#006064" class="node" style="animation-delay:0s;" />
            <circle cx="60" cy="-40" r="10" fill="#006064" class="node" style="animation-delay:0.5s;" />
            <circle cx="0" cy="70" r="10" fill="#006064" class="node" style="animation-delay:1s;" />
            
            <path d="M-60,-40 L0,20 L60,-40" fill="none" stroke="#b2ebf2" stroke-width="2" stroke-dasharray="5,5" />
        </g>
    </g>
</svg>
